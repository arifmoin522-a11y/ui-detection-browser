<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Element Detection - Browser</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/ort.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>UI Element Detection</h1>
            <p>YOLOv8s model running in-browser via ONNX Runtime Web</p>
        </header>

        <div class="controls">
            <label class="upload-btn">
                <input type="file" id="imageInput" accept="image/*" hidden>
                Upload Screenshot
            </label>
            <button id="detectBtn" disabled>Detect UI Elements</button>
            <div class="threshold-control">
                <label for="confThreshold">Confidence: <span id="confValue">0.25</span></label>
                <input type="range" id="confThreshold" min="0.1" max="0.9" step="0.05" value="0.25">
            </div>
        </div>

        <div id="status" class="status">Select an image to begin</div>

        <div class="canvas-container">
            <canvas id="outputCanvas"></canvas>
            <div id="loadingOverlay" class="loading-overlay hidden">
                <div class="spinner"></div>
                <span>Loading model...</span>
            </div>
        </div>

        <div id="results" class="results hidden">
            <h2>Detected Elements</h2>
            <div id="resultsList" class="results-list"></div>
        </div>
    </div>

    <script src="js/detector.js"></script>
    <script src="js/yolo_adapter.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
